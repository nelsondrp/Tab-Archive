<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #ffffff; --text-color: #202124; --header-bg: #f8f9fa; --border-color: #dadce0;
      --group-bg: #ffffff; --link-color: #1a73e8; --icon-hover: #e8eaed; --btn-danger: #d93025;
      --star-color: #fbbc04;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202124; --text-color: #e8eaed; --header-bg: #303134; --border-color: #5f6368;
        --group-bg: #292a2d; --link-color: #8ab4f8; --icon-hover: #3c4043; --btn-danger: #f28b82;
      }
    }
    :root[data-theme="light"] { --bg-color: #ffffff; --text-color: #202124; --header-bg: #f8f9fa; --border-color: #dadce0; --group-bg: #ffffff; --link-color: #1a73e8; --icon-hover: #e8eaed; --btn-danger: #d93025; }
    :root[data-theme="dark"] { --bg-color: #202124; --text-color: #e8eaed; --header-bg: #303134; --border-color: #5f6368; --group-bg: #292a2d; --link-color: #8ab4f8; --icon-hover: #3c4043; --btn-danger: #f28b82; }

    body { width: 380px; max-height: 550px; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-color); color: var(--text-color); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .header { position: sticky; top: 0; background: var(--header-bg); padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 10; font-weight: bold;}
    .header-icons { display: flex; gap: 12px; }
    .icon-btn { cursor: default; text-decoration: none; color: var(--text-color); font-size: 16px; opacity: 0.8; }
    .icon-btn:hover { opacity: 1; }

    #content-wrapper { overflow-y: auto; flex-grow: 1; }
    .container { padding: 12px; }

    .context-group { margin-bottom: 16px; background: var(--group-bg); border-radius: 6px; border: 1px solid var(--border-color); }
    .context-group.dragging { opacity: 0.4; border: 2px dashed var(--link-color); }

    .context-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(128,128,128,0.05); border-bottom: 1px solid var(--border-color); cursor: default; }

    /* Layout para alinhar no topo quando o título quebra linha */
    .header-left { display: flex; align-items: flex-start; flex-grow: 1; min-width: 0; padding-top: 2px;}

    /* O ícone de arrastar (Hamburguer) */
    .drag-handle { cursor: pointer; font-size: 14px; opacity: 0.5; padding-right: 8px; user-select: none; line-height: 1.2; }
    .drag-handle:hover { opacity: 1; }

    .collapse-btn { cursor: default; font-size: 10px; width: 16px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; user-select: none; margin-right: 6px; opacity: 0.7; line-height: 1.5; padding-top: 2px;}
    .context-group:not(.collapsed) .collapse-btn { transform: rotate(90deg); }

    /* Título corrigido: agora quebra linha e mostra tudo */
    .context-title { font-size: 13px; font-weight: 600; word-break: break-word; outline: none; padding: 2px 6px; border: 2px solid transparent; border-radius: 4px; transition: border 0.2s, background 0.2s; line-height: 1.3; }

    .context-title[contenteditable="true"] { background: var(--bg-color); border-color: var(--link-color); box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15); cursor: text; }

    .actions { flex-shrink: 0; display: flex; gap: 8px; margin-left: 10px; align-items: flex-start; padding-top: 4px;}
    .actions span { cursor: default; font-size: 12px; opacity: 0.7; }
    .actions span:hover { opacity: 1; }
    .actions .del:hover { color: var(--btn-danger); }

    .link-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .collapsed .link-list { display: none; }

    .link-item { display: flex; align-items: center; font-size: 12px; padding: 4px; border-radius: 4px; }
    .link-item:hover { background: var(--icon-hover); }

    .link-checkbox { margin-right: 8px; cursor: default; accent-color: var(--btn-danger); width: 14px; height: 14px; display: none; }
    body.selection-mode .link-checkbox { display: inline-block; }

    .favicon { width: 16px; height: 16px; margin-right: 8px; border-radius: 2px; flex-shrink: 0; }

    a { cursor: default; color: var(--link-color); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
    a:hover { text-decoration: underline; }

    .hover-action { cursor: default; opacity: 0; padding: 0 4px; font-size: 14px; flex-shrink: 0;}
    .del-link { color: var(--btn-danger); font-weight: bold; }
    .fav-link { color: var(--star-color); }
    .link-item:hover .hover-action { opacity: 1; }

    .empty { text-align: center; color: var(--border-color); padding: 30px 10px; font-style: italic;}
    .bulk-bar { position: sticky; bottom: 0; background: var(--header-bg); padding: 10px; border-top: 1px solid var(--border-color); text-align: center; display: none; z-index: 10; }
    .btn-danger { background: var(--btn-danger); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: default; font-weight: bold; width: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <span>Tab Archive</span>
    <div class="header-icons">
      <span id="toggleSelection" class="icon-btn" title="Select Multiple">☑️</span>
      <span id="openOptions" class="icon-btn" title="Settings">⚙️</span>
    </div>
  </div>

  <div id="content-wrapper">
    <div class="container" id="content"></div>
  </div>

  <div class="bulk-bar" id="bulkBar">
    <button class="btn-danger" id="deleteSelectedBtn">Delete Selected (<span id="selectedCount">0</span>)</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
